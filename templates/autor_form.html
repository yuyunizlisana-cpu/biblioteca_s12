{% extends "base.html" %}
{% block content %}
<p class="eyebrow">Catalogo</p>
<h1 style="margin-bottom: 1.5rem;">{{ 'Editar autor' if autor else 'Nuevo autor' }}</h1>

<form method="POST" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
        <label>Nombre</label>
        <input type="text" name="nombre" required maxlength="100" value="{{ autor.nombre if autor else '' }}">
    </div>
    <div class="field">
        <label>Nacionalidad</label>
        <input type="text" name="nacionalidad" maxlength="60" value="{{ autor.nacionalidad if autor else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('listar_autores') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
